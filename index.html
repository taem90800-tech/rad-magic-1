<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Space</title>
<style>
:root{--bg:#0a0a0c;--panel:#16161a;--line:#2a2a31;--text:#f2f2f4;--mute:#8d8d98;--red:#ff2d3d;--red2:#a8101c;--ok:#35d07f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#000;color:var(--text);font-family:"Kanit","Noto Sans Thai",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100vh;background:radial-gradient(120% 50% at 50% 0,#2a0a0e 0,var(--bg) 60%);padding:20px 16px 40px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.5px}
h1 span{color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.badge{font-size:12px;color:var(--ok);border:1px solid #1d5a3b;padding:3px 10px;border-radius:99px}
h2{font-size:14px;color:var(--mute);font-weight:500;margin:22px 0 10px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.game{flex:0 0 118px;scroll-snap-align:start;border:2px solid transparent;border-radius:16px;background:none;color:var(--text);padding:0;font:inherit;text-align:center}
.game .ico{height:118px;border-radius:14px;display:grid;place-items:center;font-size:40px}
.game b{display:block;font-size:13px;font-weight:500;margin:6px 0 4px}
.game.sel{border-color:var(--red)}
.add .ico{background:var(--panel);border:1px dashed var(--line);color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{color:var(--mute);font-size:12px}
.stat div{font-size:26px;font-weight:700;margin-top:2px}
.stat div i{font-size:12px;color:var(--mute);font-style:normal;font-weight:400}
.modes{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.modes button{border:0;background:none;color:var(--mute);font:inherit;padding:11px 0;border-radius:10px;font-size:14px}
.modes button.on{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:600}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border:0}
.row p{margin:0;font-size:15px}.row small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.sw{position:relative;flex:0 0 46px;height:26px;border-radius:99px;background:#34343c;border:0;padding:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:var(--red)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--red);margin:6px 0 0}
.fan{padding:14px}.fan .h{display:flex;justify-content:space-between;font-size:15px}
.go{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:24px;width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 8px 30px #ff2d3d55}
.hud{position:fixed;inset:0;background:#000a;display:none;place-items:end center;z-index:5;padding:20px 20px 60px}
.hud.show{display:grid}
.hud .card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--red);border-radius:18px;padding:20px;text-align:center}
.hud .card h3{margin:0 0 6px;font-size:20px}
.hud .card p{color:var(--mute);margin:0 0 16px;font-size:14px;line-height:1.6}
.hud .card button{border:1px solid var(--line);background:none;color:var(--text);font:inherit;padding:10px 22px;border-radius:12px}
.fps{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;background:#000b;border:1px solid var(--red);border-radius:10px;padding:6px 10px;font-size:12px;display:none;z-index:6;line-height:1.5}
.fps.show{display:block}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;border:1px solid var(--line);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.edge{position:fixed;right:0;top:0;bottom:0;width:26px;z-index:8;display:none;touch-action:none;align-items:center;justify-content:flex-end}
.edge.show{display:flex}
.edge i{width:5px;height:64px;border-radius:5px 0 0 5px;background:var(--red);box-shadow:0 0 12px var(--red)}
.scrim{position:fixed;inset:0;z-index:7;display:none}.scrim.show{display:block}
.panel{position:fixed;inset:0;z-index:8;background:#000;display:none}
.panel.open{display:block}
.gsi{position:absolute;top:0;left:0;width:100vw;height:100vh;display:flex;flex-direction:column;background:radial-gradient(45% 70% at 50% 60%,#2a0a0d,#0b0b0c);font-size:3vmin;overflow:hidden}
@media (orientation:portrait){.gsi{width:100vh;height:100vw;transform:translateX(100vw) rotate(90deg);transform-origin:0 0}}
.gtop{height:15vmin;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 2.5vmin;background:#121213;border-bottom:1px solid #222}
.gl{display:flex;gap:2.2vmin}
.rb{width:11vmin;height:11vmin;border-radius:50%;border:0;background:#4a4a4c;color:#eee;font-size:5vmin;padding:0;display:grid;place-items:center}
.rb svg{width:55%;height:55%}.rb:active{filter:brightness(1.4)}
.gmain{flex:1;min-height:0;display:grid;grid-template-columns:17% 13% 1fr 13% 17%}
.gcol{padding:2vmin;overflow-y:auto;min-height:0}
.gbar,.tabs{display:flex;gap:1.6vmin;margin-bottom:2vmin}
.vt,.tab{border:2px solid transparent;background:#222;color:#8a8a8a;font:inherit;font-size:2.6vmin;border-radius:1.4vmin;padding:0;height:6vmin}
.vt{width:9vmin;display:grid;place-items:center}.vt svg{width:55%;height:55%}.tab{flex:1;letter-spacing:.1vmin}
.vt.on,.tab.on{border-color:#d41f2b;background:#3a0a0f;color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:2vmin 1.6vmin}.tiles.list{grid-template-columns:1fr}
.tc{display:flex;flex-direction:column;align-items:center;gap:.8vmin;font-size:2.3vmin;color:#ddd;text-align:center;line-height:1.15;min-width:0}
.tiles.list .tc{flex-direction:row;gap:1.6vmin;text-align:left}.tiles.list .sq{width:11vmin;flex:none}
.sq{width:100%;aspect-ratio:1;border-radius:16%;border:2px solid transparent;background:linear-gradient(150deg,#292929,#171717);color:#fff;display:grid;place-items:center;position:relative;padding:0}
.sq svg{width:48%;height:48%}.sq:active{filter:brightness(1.5)}
.sq.on{border-color:#e3202d;background:radial-gradient(circle at 50% 30%,#7a0f18,#2a070b);box-shadow:inset 0 0 2vmin #ff2d3d55,0 0 1.2vmin #ff2d3d44}
.dots{position:absolute;top:9%;right:11%;width:.7vmin;height:.7vmin;border-radius:50%;background:#fff;box-shadow:0 1.1vmin #fff,0 2.2vmin #fff}
.strip{display:flex;flex-direction:column;align-items:center;padding:3vmin 0 2vmin;gap:2.4vmin;min-width:0}
.gauge{position:relative;width:100%;aspect-ratio:200/116;font-style:italic;font-weight:800;text-align:center}
.gauge svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tk{fill:none;stroke:#5c0c14;stroke-width:3}
.vl{fill:none;stroke:#ff2d3d;stroke-width:5;stroke-linecap:round;stroke-dasharray:var(--p,50) 100;filter:drop-shadow(0 0 4px #ff2d3d)}
.gauge b{position:absolute;left:0;right:0;top:0;font-size:7.5vmin;line-height:1}
.gauge u{position:absolute;left:0;right:0;top:40%;font-size:3.2vmin;color:#aaa;text-decoration:none}
.gauge em{position:absolute;left:0;right:0;bottom:2%;font-size:2.6vmin;color:#ff2d3d}
.hexb{position:relative;isolation:isolate;width:100%;height:6.6vmin;border:0;padding:0;background:#e3202d;color:#fff;font:inherit;font-size:2.5vmin;clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%)}
.hexb::before{content:"";position:absolute;inset:.35vmin;z-index:-1;background:#2a070b;clip-path:polygon(10% 0,90% 0,100% 50%,90% 100%,10% 100%,0 50%)}
.hexb:active{filter:brightness(1.5)}
.bars{display:flex;flex-direction:column-reverse;gap:.85vmin;width:100%;margin-top:1vmin}
.L .bars{align-items:flex-start;padding-left:8%}.R .bars{align-items:flex-end;padding-right:8%}
.bars button{height:1.65vmin;border:0;padding:0;background:#444;clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.R .bars button{clip-path:polygon(0 0,100% 0,100% 100%,8% 100%)}
.bars button.on{background:#f2f2f2}
.bi{display:block;width:4.2vmin;height:4.2vmin;color:#eee}.L .bi{align-self:flex-start;margin-left:8%}.R .bi{align-self:flex-end;margin-right:8%}
.frame{position:relative;background:repeating-linear-gradient(0deg,#e8222e 0 1.6vmin,#0000 1.6vmin 3.1vmin);clip-path:polygon(0 0,100% 0,78% 50%,100% 100%,0 100%,22% 50%)}
.art{position:absolute;inset:0 6%;clip-path:polygon(0 0,100% 0,74% 50%,100% 100%,0 100%,26% 50%);display:grid;place-items:center;font-size:30vmin;box-shadow:inset 0 0 6vmin #0008}
.art small{position:absolute;bottom:4vmin;font-size:3vmin;color:#fffc;text-shadow:0 0 1vmin #000}
.pgbar{position:absolute;left:17%;bottom:0;width:30%;height:.6vmin;background:#d9b600}
.xh{position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;z-index:6;pointer-events:none;display:none;filter:drop-shadow(0 0 2px #000)}
.xh.show{display:block}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>GAME <span>SPACE</span></h1><span class="badge" id="state">พร้อมเล่น</span></div>

  <h2>เกมของฉัน</h2>
  <div class="shelf" id="shelf"></div>

  <h2>สถานะเครื่อง</h2>
  <div class="stats">
    <div class="stat"><small>FPS</small><div id="fps">60</div></div>
    <div class="stat"><small>อุณหภูมิ</small><div><span id="tmp">36</span><i> °C</i></div></div>
    <div class="stat"><small>แรมว่าง</small><div><span id="ram">5.8</span><i> GB</i></div></div>
  </div>

  <h2>โหมดประสิทธิภาพ</h2>
  <div class="modes" id="modes">
    <button data-m="สมดุล">สมดุล</button>
    <button data-m="เทอร์โบ" class="on">เทอร์โบ</button>
    <button data-m="สุดแรง">สุดแรง</button>
  </div>

  <h2>ระหว่างเล่นเกม</h2>
  <div class="list" id="opts"></div>

  <h2>พัดลมระบายความร้อน</h2>
  <div class="list fan">
    <div class="h"><span>ความเร็วพัดลม</span><span id="fanv">60%</span></div>
    <input type="range" id="fan" min="0" max="100" value="60" aria-label="ความเร็วพัดลม">
  </div>

  <button class="go" id="go">เริ่มเล่น</button>
</div>

<div class="fps" id="hudfps"></div>
<div class="hud" id="hud"><div class="card">
  <h3 id="hn">กำลังเล่น</h3>
  <p id="hp"></p>
  <button id="stop">ออกจากเกม</button>
</div></div>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"></div>
<div class="panel" id="panel" role="dialog" aria-label="Game Space menu"><div class="gsi">
<div class="gtop"><div class="gl"><button class="rb" data-c="1" data-i="home" aria-label="Home"></button><button class="rb" data-i="edit" data-t="Edit menu" aria-label="Edit"></button><button class="rb" data-i="pad" data-t="Gamepad mode" aria-label="Gamepad"></button><button class="rb" data-i="cube" data-t="Control center" aria-label="Control center"></button></div>
<div class="gl"><button class="rb" style="background:#fff" data-t="Open browser" aria-label="Browser">🌐</button><button class="rb" style="background:#1877f2" data-t="Open chat" aria-label="Chat">💬</button><button class="rb" style="background:#fff" data-t="Open mail" aria-label="Mail">✉️</button><button class="rb" style="background:#555" data-c="1" data-i="chev" aria-label="Close menu"></button></div></div>
<div class="gmain">
<div class="gcol"><div class="gbar"><button class="vt" id="vl" data-i="list" aria-label="List"></button><button class="vt on" id="vg" data-i="grid" aria-label="Grid"></button></div><div class="tabs"><button class="tab on" data-tab="g">GAME</button><button class="tab" data-tab="t">TOOLS</button></div><div class="tiles" id="ltiles"></div></div>
<div class="strip L"><div class="gauge"><svg viewBox="0 0 200 116" aria-hidden="true"><ellipse class="tk" cx="100" cy="64" rx="94" ry="26"/><ellipse class="vl" cx="100" cy="64" rx="94" ry="26" pathLength="100"/></svg><b id="cpuv">2.6</b><u>GHz</u><em>CPU</em></div><button class="hexb" id="perf">Performance</button><div class="bars" id="b_br"></div><span class="bi" data-i="max"></span></div>
<div class="frame"><div class="art" id="art"></div></div>
<div class="strip R"><div class="gauge"><svg viewBox="0 0 200 116" aria-hidden="true"><ellipse class="tk" cx="100" cy="64" rx="94" ry="26"/><ellipse class="vl" cx="100" cy="64" rx="94" ry="26" pathLength="100"/></svg><b id="ramv">5.8</b><u>GB</u><em>RAM</em></div><button class="hexb" id="ntf">Notif Off</button><div class="bars" id="b_vo"></div><span class="bi" data-i="vol"></span></div>
<div class="gcol"><div class="tiles" id="rtiles"></div></div>
</div><div class="pgbar"></div></div></div>
<div class="xh" id="xh" aria-hidden="true"></div>
<div class="edge" id="edge"><i></i></div>

<script>
var games=[{n:"Arena Strike",e:"🎯",c:"#ff2d3d,#5a0710"},{n:"Void Racer",e:"🏎️",c:"#3d6bff,#0a1a5a"},{n:"Sky Realm",e:"🐉",c:"#9b3dff,#2a0a5a"},{n:"Pixel Farm",e:"🌱",c:"#2fd07f,#0a4a2a"}];
var opts=[
 {k:"dnd",t:"บล็อกแจ้งเตือน",d:"ไม่มีป๊อปอัปขึ้นมารบกวน",on:true},
 {k:"call",t:"ปฏิเสธสายเรียกเข้า",d:"วางสายอัตโนมัติระหว่างเล่น",on:false},
 {k:"bri",t:"ล็อกความสว่างหน้าจอ",d:"ไม่ปรับสว่างอัตโนมัติ",on:true},
 {k:"touch",t:"เพิ่มความไวสัมผัส",d:"ตอบสนองการแตะเร็วขึ้น",on:true},
 {k:"net",t:"เร่งเครือข่าย",d:"ให้เกมใช้เน็ตก่อนแอปอื่น",on:false},
 {k:"hud",t:"แสดง FPS บนหน้าจอ",d:"ดูค่าเฟรมเรตแบบเรียลไทม์",on:true}
];
var sel=0,mode="เทอร์โบ",playing=false,timer=null;
var $=function(i){return document.getElementById(i)};
function toast(t){var el=$("toast");el.textContent=t;el.className="toast show";clearTimeout(toast.h);toast.h=setTimeout(function(){el.className="toast"},1400)}
function drawShelf(){
 var h="";
 games.forEach(function(g,i){h+='<button class="game'+(i==sel?' sel':'')+'" data-i="'+i+'"><div class="ico" style="background:linear-gradient(145deg,'+g.c+')">'+g.e+'</div><b>'+g.n+'</b></button>'});
 h+='<button class="game add" data-add="1"><div class="ico">+</div><b>เพิ่มเกม</b></button>';
 $("shelf").innerHTML=h;
}
$("shelf").onclick=function(e){
 var b=e.target.closest(".game");if(!b)return;
 if(b.dataset.add){toast("เลือกเกมจากแอปที่ติดตั้งไว้");return}
 sel=+b.dataset.i;drawShelf();
};
function drawOpts(){
 var h="";
 opts.forEach(function(o,i){h+='<div class="row"><div><p>'+o.t+'</p><small>'+o.d+'</small></div><button class="sw" role="switch" aria-label="'+o.t+'" aria-checked="'+o.on+'" data-i="'+i+'"></button></div>'});
 $("opts").innerHTML=h;
}
$("opts").onclick=function(e){
 var b=e.target.closest(".sw");if(!b)return;
 var o=opts[+b.dataset.i];o.on=!o.on;b.setAttribute("aria-checked",o.on);
 toast(o.t+(o.on?" เปิดแล้ว":" ปิดแล้ว"));
};
$("modes").onclick=function(e){
 var b=e.target.closest("button");if(!b)return;
 mode=b.dataset.m;[].forEach.call($("modes").children,function(x){x.className=x===b?"on":""});
 toast("โหมด"+mode);
};
$("fan").oninput=function(){$("fanv").textContent=this.value+"%"};
function base(){return mode=="สุดแรง"?[118,44]:mode=="เทอร์โบ"?[90,40]:[60,35]}
function tick(){if(open)gsStats();
 var b=base(),f=playing?b[0]+Math.round(Math.random()*8-4):60,t=playing?b[1]+Math.random()*3+(100-$("fan").value)/20:36;
 f=Math.min(f,mode=="สุดแรง"?120:mode=="เทอร์โบ"?90:60);
 $("fps").textContent=f;$("tmp").textContent=t.toFixed(0);
 $("ram").textContent=(playing?4.2:5.8).toFixed(1);
 $("hudfps").innerHTML="FPS "+f+"<br>"+t.toFixed(0)+" °C";
}
function active(){return opts.filter(function(o){return o.on}).length}
$("go").onclick=function(){
 playing=true;var g=games[sel];
 $("hn").textContent="กำลังเล่น "+g.n;
 $("hp").textContent="โหมด"+mode+" · เปิดฟีเจอร์ "+active()+" อย่าง · พัดลม "+$("fan").value+"%";
 $("hud").className="hud show";
 var h=opts.filter(function(o){return o.k=="hud"})[0].on;
 $("hudfps").className="fps"+(h?" show":"");
 $("state").textContent="กำลังเล่น";tick();setOpen(false);toast("แตะแถบแดงที่ขอบขวาเพื่อเปิดเมนู");
};
$("stop").onclick=function(){
 playing=false;$("hud").className="hud";$("hudfps").className="fps";
 $("state").textContent="พร้อมเล่น";tick();setOpen(false);
};
var W=250,open=false,panel=$("panel"),edge=$("edge"),scrim=$("scrim");
function setOpen(v){open=v;panel.className="panel"+(v?" open":"");scrim.className="scrim"+(v?" show":"");edge.className="edge"+(playing&&!v?" show":"");if(v)drawGS();xhUpdate()}
var tab="g",st={rot:1,max:1,eco:1,sight:1},lv={br:10,vo:6};

[].forEach.call(document.querySelectorAll("[data-i]"),function(e){e.innerHTML=svg(e.dataset.i)});

var xs=1,xc=0,XN=["Dot","Cross","Circle","Plus"],XCN=["Red","White","Green","Cyan"],XCL=["#ff2d3d","#ffffff","#35d07f","#3dd9ff"],XP=['<circle cx="16" cy="16" r="3" fill="currentColor" stroke="none"/>','<path d="M16 3v9M16 20v9M3 16h9M20 16h9"/><circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/>','<circle cx="16" cy="16" r="9"/><circle cx="16" cy="16" r="1.5" fill="currentColor" stroke="none"/>','<path d="M16 6v20M6 16h20"/>'];

function isOn(k){if(k=="fan")return +$("fan").value>0;var o=opt(k);return o?o.on:!!st[k]}

function tap(k){
 if(k=="xs"||k=="xc"){if(k=="xs")xs=(xs+1)%4;else xc=(xc+1)%4;st.sight=1;xhUpdate();toast(k=="xs"?"Crosshair: "+XN[xs]:"Color: "+XCN[xc]);return}

}

 var t=e.target.closest(".tc"),b=e.target.closest("[data-n]"),r=e.target.closest("[data-t]"),c=e.target.closest("[data-c]"),tb=e.target.closest(".tab");

 if(t){tap(t.dataset.k);drawGS()}

 else if(e.target.closest("#perf")){var m=["สมดุล","เทอร์โบ","สุดแรง"];setMode(m[(m.indexOf(mode)+1)%3])}

 else if(r)toast(r.dataset.t);
};
